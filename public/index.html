<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANDORA II</title>

  <link rel="stylesheet" href="./styles/theme.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/sidebar.css">
  <link rel="stylesheet" href="./styles/quiz-editor.css">
  <link rel="stylesheet" href="./styles/quiz-attempt.css">
  <link rel="stylesheet" href="./styles/repositories.css">
  <link rel="stylesheet" href="./styles/schedule.css">
  <link rel="stylesheet" href="./styles/tasks.css">
  <link rel="stylesheet" href="./styles/settings.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/home.css">

  <style>
    .skip-link {
      position: fixed;
      z-index: 10;
      inset-block-start: 8px;
      inset-inline-start: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-control);
      background-color: var(--color-primary);
      color: var(--color-primary-text);
      font-weight: 700;
    }

    .skip-link:not(:focus) {
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>

  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app-content">Skip to main content</a>

  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Study workspace">
      <p class="app-brand">PANDORA II</p>
    </aside>

    <div class="app-workspace">
      <header id="app-header" class="app-header"></header>

      <main id="app-content" class="app-content" tabindex="-1">
        <h1>Home</h1>
      </main>
    </div>
  </div>

  <div id="app-modals"></div>

  <script>
    const skipLink = document.querySelector(".skip-link");
    const mainContent = document.querySelector("#app-content");

    skipLink.addEventListener("click", (event) => {
      event.preventDefault();
      mainContent.focus({ preventScroll: true });
      mainContent.scrollIntoView({ block: "start" });
    });
  </script>
</body>
</html>
